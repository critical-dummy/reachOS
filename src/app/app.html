<div class="relative flex items-center justify-center w-screen h-screen overflow-hidden bg-transparent">
  <!-- Centered canvas wrapper; maintains identical dimensions to the canvas without altering flow -->
  <div class="relative inline-block shrink-0">
    <canvas
      #displayCanvas
      width="1080"
      height="2424"
      style="aspect-ratio: 1080 / 2424; width: min(100vw, calc(100vh * 1080 / 2424)); height: min(100vh, calc(100vw * 2424 / 1080)); max-width: 100vw; max-height: 100vh; display: block; object-fit: contain;"
    ></canvas>

    @if (hasSideSpace()) {
      <!-- Left Top Logo Capsule: positioned in empty space directly left of display, aligned to top -->
      <aside
        class="absolute right-[calc(100%+14px)] top-0 flex flex-col items-center select-none pointer-events-auto"
        aria-label="reachOS branding"
      >
        <div class="w-10 min-h-[190px] rounded-full border border-white/10 bg-black/40 backdrop-blur-md shadow-sm flex items-center justify-center py-4">
          <!-- Text rotation: -90deg so the bottom of the letters faces right toward the display -->
          <div class="whitespace-nowrap select-none font-inter -rotate-90 origin-center text-xs tracking-wider flex items-center gap-1.5 pointer-events-none">
            <span class="text-white/90 font-normal">reachOS</span>
            <span class="text-white/45 italic font-normal">by dummy135</span>
          </div>
        </div>
      </aside>

      <!-- Right Top Virtual Device Controller Capsule: positioned directly right of display, aligned to top -->
      <aside
        class="absolute left-[calc(100%+14px)] top-0 flex flex-col items-center gap-2.5 select-none pointer-events-auto"
        aria-label="Device controls"
      >
        <!-- Vertical Controller Capsule -->
        <div class="w-10 py-3 rounded-full border border-white/10 bg-black/40 backdrop-blur-md shadow-sm flex flex-col items-center gap-2">
          <!-- Power toggle button -->
          <button
            type="button"
            (click)="togglePower()"
            class="w-7 h-7 rounded-full flex items-center justify-center text-white/70 hover:text-white transition-colors cursor-pointer"
            [title]="powerTitle()"
            aria-label="Power"
          >
            <mat-icon
              class="text-[18px] w-[18px] h-[18px] flex items-center justify-center"
              [class.text-emerald-400]="isRunning()"
              [class.text-amber-400]="isPaused()"
              [class.text-neutral-400]="isStopped()"
            >power_settings_new</mat-icon>
          </button>

          <!-- Play / Pause button -->
          <button
            type="button"
            (click)="togglePlayPause()"
            class="w-7 h-7 rounded-full flex items-center justify-center text-white/70 hover:text-white transition-colors cursor-pointer"
            [title]="playPauseTitle()"
            aria-label="Play or Pause"
          >
            <mat-icon class="text-[18px] w-[18px] h-[18px] flex items-center justify-center">
              {{ isRunning() ? 'pause' : 'play_arrow' }}
            </mat-icon>
          </button>

          <!-- Restart button -->
          <button
            type="button"
            (click)="restart()"
            class="w-7 h-7 rounded-full flex items-center justify-center text-white/70 hover:text-white transition-colors cursor-pointer"
            title="Restart Device"
            aria-label="Restart"
          >
            <mat-icon class="text-[18px] w-[18px] h-[18px] flex items-center justify-center">
              restart_alt
            </mat-icon>
          </button>

          <!-- Subtle divider -->
          <div class="w-4 h-px bg-white/10 my-1"></div>

          <!-- Vertical state label (rotated 90deg, bottom faces left toward display) -->
          <div class="h-14 flex items-center justify-center">
            <span class="whitespace-nowrap select-none font-inter rotate-90 origin-center text-[10px] font-medium tracking-widest text-neutral-400 uppercase pointer-events-none">
              {{ stateLabel() }}
            </span>
          </div>
        </div>

        <!-- Mobile 1:1 Square Keyboard Button (rendered ONLY on supported mobile input environments) -->
        @if (showMobileKeyboard()) {
          <button
            type="button"
            (click)="openKeyboard()"
            class="w-10 h-10 aspect-square rounded-xl border border-white/10 bg-black/40 backdrop-blur-md shadow-sm flex items-center justify-center text-white/80 hover:text-white active:scale-95 transition-all cursor-pointer"
            title="Open Mobile Keyboard"
            aria-label="Open keyboard"
          >
            <mat-icon class="text-[20px] w-5 h-5 flex items-center justify-center">
              keyboard
            </mat-icon>
          </button>
        }
      </aside>
    }
  </div>

  <!-- Off-screen hidden input to capture mobile soft keyboard input without altering viewport -->
  <input
    #hiddenInput
    type="text"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    class="fixed opacity-0 pointer-events-none -left-[9999px] bottom-0 w-px h-px text-[16px]"
    (compositionstart)="onCompositionStart()"
    (compositionupdate)="onCompositionUpdate()"
    (compositionend)="onCompositionEnd($event)"
    (keydown)="onKeyDown($event)"
    (input)="onInput($event)"
    aria-hidden="true"
    tabindex="-1"
  />
</div>

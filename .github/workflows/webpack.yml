name: Angular CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false

      - name: Lint
        run: npx ng lint

      - name: Build static Angular application
        run: npx ng build --configuration production --output-mode=static --base-href="/"
